  checkout: harness-arena@d44b94d
  # 2026-10-08 new-model bench: 16k ctx, -e off, --lean-prompt, 3 rounds (benched on e529fbe).
  # little-coder+qwen3.5:4b re-evaluated on d44b94d (landing-path confinement, #17 = fccad9d).
policy:
  quality_bar: high
  min_runs: 2
  # Arena skeleton PASS (SOLUTION.md exists) is insufficient alone; require usable artifact.
  require_manual_or_objective_check: true
  confidence_for_auto_route: high
  # Rank for routing: high > medium > provisional > low.
  # provisional is below medium (awaiting evaluation) — does not meet require_confidence: medium.
  confidence_levels:
    high: "PASS >= 0.9 on rubric AND human/agent review note AND ≥2 arena runs"
    medium: "PASS >= 0.7 or preliminary positive signal (evidence-backed; outranks provisional)"
    provisional: "promising / promote-with-notes; awaiting arena evaluation — ranks below medium; only auto-routes at require_confidence: low"
    low: "exploratory; not yet reliable"
